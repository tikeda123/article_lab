<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circle Rubik-like Puzzle (Canvas)</title>
  <style>
    :root{
      --bg:#ffffff;
      --panel:#f6f7f9;
      --text:#111;
      --muted:#666;
      --border:#d7dbe0;
      --btn:#ffffff;
      --btn-hover:#f1f3f5;
      --accent:#2b6cb0;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      display:flex;
      gap:12px;
      padding:12px;
      box-sizing:border-box;
      align-items:stretch;
    }
    .left{
      flex: 1 1 auto;
      min-width: 520px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .right{
      width: 340px;
      flex: 0 0 auto;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:10px;
      padding:12px;
      box-sizing:border-box;
    }
    canvas{
      width:100%;
      height:520px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:10px;
      display:block;
      touch-action:none; /* ドラッグ操作を安定させる */
    }
    .controls{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    button{
      appearance:none;
      border:1px solid var(--border);
      background:var(--btn);
      border-radius:8px;
      padding:8px 10px;
      cursor:pointer;
      font-size:14px;
    }
    button:hover{ background:var(--btn-hover); }
    button.primary{
      border-color: #bcd0ea;
      background:#e9f2ff;
    }
    .stat{
      font-size:14px;
      color:var(--muted);
      margin-left:auto;
    }
    .ring-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:10px;
    }
    .ring-item{
      border:1px solid var(--border);
      background:#fff;
      border-radius:10px;
      padding:10px;
    }
    .ring-item .row{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .ring-item .name{
      font-weight:600;
      font-size:14px;
    }
    .ring-item .range{
      margin-left:auto;
      color:var(--muted);
      font-size:12px;
    }
    .ring-item .btns{
      margin-top:8px;
      display:flex;
      gap:8px;
    }
    .hint{
      margin-top:12px;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }
    .badge{
      display:inline-block;
      border:1px solid var(--border);
      border-radius:999px;
      padding:2px 8px;
      font-size:12px;
      color:var(--muted);
      background:#fff;
    }
    .ok{
      color:#0a7a2f;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <canvas id="cv"></canvas>
      <div class="controls">
        <button id="shuffle" class="primary">シャッフル</button>
        <button id="reset">リセット</button>
        <button id="solve">完成状態へ</button>
        <span class="stat" id="stat">Moves: 0</span>
      </div>
    </div>

    <aside class="right">
      <div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-weight:700;">操作</div>
          <span class="badge">ドラッグ</span>
          <span class="badge">ボタン回転</span>
        </div>
        <div class="hint">
          円の<strong>半径帯（リング）</strong>をドラッグすると、その帯に属する点が中心の周りに回転します。<br/>
          ゴールは、初期のように色が面ごとに揃う（=元の配置に戻る）ことです。
        </div>

        <div class="ring-list" id="ringList"></div>

        <div class="hint">
          <div style="font-weight:700;color:#111;margin-bottom:6px;">カスタマイズ</div>
          コード内の <code>CONFIG</code> で以下を調整できます：
          <ul style="margin:8px 0 0 18px;padding:0;">
            <li>同心円の数と半径（<code>ringBounds</code>）</li>
            <li>回転刻み角（<code>stepDeg</code>）</li>
            <li>点の初期配置（<code>buildSolvedLayout()</code>）</li>
          </ul>
        </div>
      </div>
    </aside>
  </div>

<script>
(() => {
  // ==========
  // 設定
  // ==========
  const CONFIG = {
    // 円（境界）の半径。表示する同心円の本数になります（例: 5本）
    // この境界で「半径帯（リング）」を区切ります。
    ringBounds: [40, 70, 100, 130, 160],

    // 1ステップ回転角（離散回転）。値を小さくすると難度が上がります。
    stepDeg: 30,

    // 点（○）の半径（見た目）
    dotRadius: 6,

    // 3x3面の点間隔
    faceGridSpacing: 18,

    // 面（色）の定義
    colors: {
      green:  "#10b010",
      yellow: "#f2d300",
      blue:   "#1a4fff",
      pink:   "#ff55ff",
      cyan:   "#00c8c8",
      red:    "#ff2b2b",
    },

    // シャッフル手数（ランダム回転回数）
    shuffleMoves: 40,
  };

  // ==========
  // Canvas 基本
  // ==========
  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");

  function resizeCanvasToDisplaySize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.round(rect.width * dpr);
    const h = Math.round(rect.height * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  // 左側に寄せた中心（右パネルがあるため）
  function getCenter() {
    // キャンバスの「見た目」中心を少し左へ
    const w = canvas.width, h = canvas.height;
    return { cx: Math.round(w * 0.33), cy: Math.round(h * 0.50) };
  }

  // ==========
  // パズル状態
  // ==========
  /** bead: { id, color, x0,y0, r, theta0, theta, x,y, band } */
  let beads = [];
  let moves = 0;
  let solved = true;

  const stepRad = () => (CONFIG.stepDeg * Math.PI) / 180;

  // 半径からリング帯（band）を決定
  // band=0: r < ringBounds[0]
  // band=i: ringBounds[i-1] <= r < ringBounds[i]
  // band=-1: r >= ringBounds[last]（外側固定）
  function bandFromRadius(r) {
    for (let i = 0; i < CONFIG.ringBounds.length; i++) {
      if (r < CONFIG.ringBounds[i]) return i;
    }
    return -1;
  }

  function buildSolvedLayout() {
    // 画像の「6面がまとまっている」状態に近い配置（おおよそ）
    // 同心円の中心を基準に、6色を上下左右に配置します。
    const { cx, cy } = getCenter();
    const s = CONFIG.faceGridSpacing;

    beads = [];
    let id = 0;

    const addFace3x3 = (color, centerX, centerY) => {
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const x0 = centerX + (col - 1) * s;
          const y0 = centerY + (row - 1) * s;

          const dx = x0 - cx;
          const dy = y0 - cy;
          const r = Math.hypot(dx, dy);
          const theta0 = Math.atan2(dy, dx);

          beads.push({
            id: id++,
            color,
            x0, y0,
            r,
            theta0,
            theta: theta0,
            x: x0,
            y: y0,
            band: bandFromRadius(r),
          });
        }
      }
    };

    // 面の配置（中心からのオフセット）
    // ※ outer ring の外側に置いた面は固定点になり、基準になって解きやすくなります
    addFace3x3(CONFIG.colors.green,  cx,        cy - 180);
    addFace3x3(CONFIG.colors.yellow, cx,        cy - 60);
    addFace3x3(CONFIG.colors.cyan,   cx,        cy + 60);
    addFace3x3(CONFIG.colors.red,    cx,        cy + 180);
    addFace3x3(CONFIG.colors.pink,   cx - 120,  cy);
    addFace3x3(CONFIG.colors.blue,   cx + 120,  cy);

    moves = 0;
    solved = true;
    updateStat();
  }

  function applyRotationToBand(bandIndex, dirSteps) {
    if (bandIndex < 0) return;

    const { cx, cy } = getCenter();
    const dTheta = dirSteps * stepRad();

    for (const b of beads) {
      if (b.band !== bandIndex) continue;
      b.theta += dTheta;
      b.x = cx + b.r * Math.cos(b.theta);
      b.y = cy + b.r * Math.sin(b.theta);
    }

    moves += Math.abs(dirSteps);
    solved = checkSolved();
    updateStat();
    requestDraw();
  }

  function resetToSolved() {
    const { cx, cy } = getCenter();
    for (const b of beads) {
      b.theta = b.theta0;
      b.x = b.x0;
      b.y = b.y0;
      // band は中心位置基準で固定（レイアウトが変わらない前提）
      const dx = b.x0 - cx, dy = b.y0 - cy;
      b.r = Math.hypot(dx, dy);
      b.theta0 = Math.atan2(dy, dx);
      b.band = bandFromRadius(b.r);
    }
    moves = 0;
    solved = true;
    updateStat();
    requestDraw();
  }

  function checkSolved() {
    // 初期座標に全点が戻っているか（許容誤差つき）で判定
    // ※離散回転 + 浮動小数誤差を考慮して少し甘め
    const eps = 0.9; // px
    const eps2 = eps * eps;
    for (const b of beads) {
      const dx = b.x - b.x0;
      const dy = b.y - b.y0;
      if (dx*dx + dy*dy > eps2) return false;
    }
    return true;
  }

  // ==========
  // 描画
  // ==========
  let needsDraw = true;
  function requestDraw() { needsDraw = true; }

  function draw() {
    if (!needsDraw) return;
    needsDraw = false;

    resizeCanvasToDisplaySize();
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const { cx, cy } = getCenter();

    // 背景
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);

    // 選択中リングのハイライト（必要に応じて）
    if (drag.active && drag.band >= 0) {
      const inner = drag.band === 0 ? 0 : CONFIG.ringBounds[drag.band - 1];
      const outer = CONFIG.ringBounds[drag.band];
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, outer, 0, Math.PI * 2, false);
      ctx.arc(cx, cy, inner, 0, Math.PI * 2, true);
      ctx.closePath();
      ctx.fillStyle = "rgba(43,108,176,0.08)";
      ctx.fill();
      ctx.restore();
    }

    // 同心円（境界線）
    ctx.save();
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 2;
    for (const r of CONFIG.ringBounds) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    // 点（○）
    for (const b of beads) {
      // 外周の固定点は少し縁取りを強める
      const isFixed = (b.band === -1);

      ctx.beginPath();
      ctx.arc(b.x, b.y, CONFIG.dotRadius, 0, Math.PI * 2);

      ctx.fillStyle = b.color;
      ctx.fill();

      ctx.lineWidth = isFixed ? 2 : 1;
      ctx.strokeStyle = isFixed ? "rgba(0,0,0,0.45)" : "rgba(0,0,0,0.25)";
      ctx.stroke();
    }

    // 文字情報
    ctx.save();
    ctx.fillStyle = "#333";
    ctx.font = `${Math.round(14 * (window.devicePixelRatio || 1))}px system-ui, sans-serif`;
    const info = solved ? "SOLVED" : "PLAYING";
    ctx.fillText(`Status: ${info}`, 18, 26);
    ctx.restore();
  }

  function tick() {
    draw();
    requestAnimationFrame(tick);
  }

  // ==========
  // 入力（ドラッグでリング回転）
  // ==========
  const drag = {
    active: false,
    band: -1,
    lastAngle: 0,
    accum: 0,
  };

  function getPointerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const x = (evt.clientX - rect.left) * dpr;
    const y = (evt.clientY - rect.top) * dpr;
    return { x, y };
  }

  function normAngle(a) {
    // (-PI, PI] に正規化
    while (a <= -Math.PI) a += Math.PI * 2;
    while (a > Math.PI) a -= Math.PI * 2;
    return a;
  }

  canvas.addEventListener("pointerdown", (evt) => {
    resizeCanvasToDisplaySize();
    const { x, y } = getPointerPos(evt);
    const { cx, cy } = getCenter();

    const dx = x - cx, dy = y - cy;
    const r = Math.hypot(dx, dy);

    const band = bandFromRadius(r);
    if (band < 0) return; // 外側は固定なのでドラッグ開始しない

    drag.active = true;
    drag.band = band;
    drag.lastAngle = Math.atan2(dy, dx);
    drag.accum = 0;

    canvas.setPointerCapture(evt.pointerId);
    requestDraw();
  });

  canvas.addEventListener("pointermove", (evt) => {
    if (!drag.active) return;
    const { x, y } = getPointerPos(evt);
    const { cx, cy } = getCenter();

    const dx = x - cx, dy = y - cy;
    const angle = Math.atan2(dy, dx);

    let d = normAngle(angle - drag.lastAngle);
    drag.lastAngle = angle;

    drag.accum += d;

    const s = stepRad();
    // accum が 1ステップ分を超えたら回転を確定（離散回転）
    while (drag.accum >= s) {
      applyRotationToBand(drag.band, +1);
      drag.accum -= s;
    }
    while (drag.accum <= -s) {
      applyRotationToBand(drag.band, -1);
      drag.accum += s;
    }
  });

  function endDrag(evt) {
    if (!drag.active) return;
    drag.active = false;
    drag.band = -1;
    drag.accum = 0;
    requestDraw();
  }

  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", (evt) => {
    // pointer capture が効いていれば leave では終わらないが、念のため
    // endDrag(evt);
  });

  // ==========
  // UI ボタン
  // ==========
  const statEl = document.getElementById("stat");
  function updateStat() {
    statEl.textContent = `Moves: ${moves}  |  ${solved ? "Solved" : "Not solved"}`;
    if (solved) statEl.classList.add("ok");
    else statEl.classList.remove("ok");
  }

  document.getElementById("shuffle").addEventListener("click", () => {
    // シャッフルは「完成状態からランダム回転」を適用
    resetToSolved();
    for (let i = 0; i < CONFIG.shuffleMoves; i++) {
      const band = Math.floor(Math.random() * CONFIG.ringBounds.length);
      const dir = Math.random() < 0.5 ? -1 : +1;
      applyRotationToBand(band, dir);
    }
    // シャッフルは手数としてカウントしない場合はここで moves=0 にする
    moves = 0;
    solved = checkSolved();
    updateStat();
    requestDraw();
  });

  document.getElementById("reset").addEventListener("click", () => {
    // 現在状態を「初期の完成状態」に戻す
    resetToSolved();
  });

  document.getElementById("solve").addEventListener("click", () => {
    // 強制的に完成状態へ（デバッグ用）
    resetToSolved();
  });

  // 右パネルのリング操作ボタン
  const ringListEl = document.getElementById("ringList");

  function renderRingList() {
    ringListEl.innerHTML = "";
    const bounds = CONFIG.ringBounds.slice();

    for (let i = 0; i < bounds.length; i++) {
      const inner = (i === 0) ? 0 : bounds[i - 1];
      const outer = bounds[i];

      const item = document.createElement("div");
      item.className = "ring-item";

      const row = document.createElement("div");
      row.className = "row";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = `リング ${i + 1}`;

      const range = document.createElement("div");
      range.className = "range";
      range.textContent = `${inner}–${outer}px`;

      row.appendChild(name);
      row.appendChild(range);

      const btns = document.createElement("div");
      btns.className = "btns";

      const ccw = document.createElement("button");
      ccw.textContent = "⟲ 反時計";
      ccw.addEventListener("click", () => applyRotationToBand(i, -1));

      const cw = document.createElement("button");
      cw.textContent = "時計 ⟳";
      cw.addEventListener("click", () => applyRotationToBand(i, +1));

      btns.appendChild(ccw);
      btns.appendChild(cw);

      item.appendChild(row);
      item.appendChild(btns);
      ringListEl.appendChild(item);
    }
  }

  // ==========
  // 初期化
  // ==========
  function init() {
    resizeCanvasToDisplaySize();
    buildSolvedLayout();
    renderRingList();
    requestDraw();
    tick();
  }

  window.addEventListener("resize", () => {
    // リサイズ時は中心が変わるので、完成配置を再計算する（安全側）
    // 「現状維持」を優先したい場合は、ここを reset しない実装に変更してください。
    buildSolvedLayout();
    renderRingList();
    requestDraw();
  });

  init();
})();
</script>
</body>
</html>
