<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2933} .muted{fill:#617080} .grid{stroke:#d7dde5;stroke-width:1} .axis{stroke:#667085;stroke-width:1.2}</style>
<rect x="0" y="0" width="1000" height="360" fill="#ffffff"/>
<text x="32" y="36" font-size="22" font-weight="700">Experiment 3: Horizon Tradeoff</text>
<text x="32" y="62" font-size="13" class="muted">Compares G3 24h/48h with risk-on-only 48h. Higher is better.</text>
<line x1="245.0" y1="74" x2="245.0" y2="294" class="grid"/>
<text x="245.0" y="318" font-size="11" text-anchor="middle" class="muted">-12.3%</text>
<line x1="366.0" y1="74" x2="366.0" y2="294" class="grid"/>
<text x="366.0" y="318" font-size="11" text-anchor="middle" class="muted">5.9%</text>
<line x1="487.0" y1="74" x2="487.0" y2="294" class="grid"/>
<text x="487.0" y="318" font-size="11" text-anchor="middle" class="muted">24.1%</text>
<line x1="608.0" y1="74" x2="608.0" y2="294" class="grid"/>
<text x="608.0" y="318" font-size="11" text-anchor="middle" class="muted">42.4%</text>
<line x1="729.0" y1="74" x2="729.0" y2="294" class="grid"/>
<text x="729.0" y="318" font-size="11" text-anchor="middle" class="muted">60.6%</text>
<line x1="850.0" y1="74" x2="850.0" y2="294" class="grid"/>
<text x="850.0" y="318" font-size="11" text-anchor="middle" class="muted">78.8%</text>
<line x1="326.8" y1="74" x2="326.8" y2="294" class="axis"/>
<text x="231" y="110" font-size="13" text-anchor="end">G3 low x on 24h</text>
<rect x="320.4" y="92" width="6.4" height="22" rx="3" fill="#B5524A"/>
<text x="874" y="109" font-size="12" font-weight="600">-1.0%</text>
<text x="231" y="148" font-size="13" text-anchor="end">G3 low x on 48h</text>
<rect x="286.7" y="130" width="40.1" height="22" rx="3" fill="#B5524A"/>
<text x="874" y="147" font-size="12" font-weight="600">-6.0%</text>
<text x="231" y="186" font-size="13" text-anchor="end">G2 risk-on 48h</text>
<rect x="326.8" y="168" width="481.5" height="22" rx="3" fill="#3D8B6D"/>
<text x="874" y="185" font-size="12" font-weight="600">72.6%</text>
<text x="547.5" y="342" font-size="12" text-anchor="middle" class="muted">Final return 5th percentile</text>
</svg>
